name: Validar e publicar plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: escalas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
          MYSQL_DATABASE: ccs_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -plocal-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, openssl
      - name: Sintaxe e busca de pessoas
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/task-views.js
          node --check assets/event-views.js
          node --check assets/app.js
          node --check assets/auth.js
          node tests/people.cjs
          node tests/events.cjs
          node tests/tasks.cjs
          node tests/convocations.cjs
      - name: Interface mobile no navegador
        env:
          CCS_PLAYWRIGHT_MODULE: /tmp/ccs-browser/node_modules/playwright
          CCS_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          npm install --prefix /tmp/ccs-browser --no-save --package-lock=false playwright@1.58.2
          node tests/browser.cjs
      - name: Instalar WordPress para testes
        env:
          MYSQL_PWD: local-test-only
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --path=/tmp/ccs-wp --quiet
          php /tmp/wp-cli.phar config create --path=/tmp/ccs-wp --dbname=ccs_test --dbuser=root --dbpass=local-test-only --dbhost=127.0.0.1:3306 --quiet
          php /tmp/wp-cli.phar core install --path=/tmp/ccs-wp --url=http://localhost --title=Test --admin_user=admin --admin_password=local-test-password --admin_email=admin@example.invalid --skip-email --quiet
          ln -s "$GITHUB_WORKSPACE" /tmp/ccs-wp/wp-content/plugins/ccshalom-escalas
          php /tmp/wp-cli.phar plugin activate ccshalom-escalas --path=/tmp/ccs-wp
      - name: Fluxos e atualizador no WordPress
        env:
          CCS_WP_PATH: /tmp/ccs-wp
        run: php tests/wordpress-smoke.php
      - name: Integração com Portal Push 0.4.0
        env:
          CCS_WP_PATH: /tmp/ccs-wp
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/paulommaeda/push-notifications.git /tmp/ccs-portal-push
          git -C /tmp/ccs-portal-push checkout --quiet 00b67938ceb0ccd453419961aac7486742f5d4b1
          ln -s /tmp/ccs-portal-push /tmp/ccs-wp/wp-content/plugins/portal-push
          php /tmp/wp-cli.phar plugin activate portal-push --path=/tmp/ccs-wp
          php tests/push.php
      - name: Alteração de senha sem mail e compatibilidade SMTP
        env:
          CCS_WP_PATH: /tmp/ccs-wp
        run: |
          set -euo pipefail
          CCS_TEST_NATIVE_MAIL=1 php tests/mail.php
          python3 tests/smtp-sink.py > /tmp/ccs-smtp-test.log 2>&1 &
          ccs_smtp_test_pid=$!
          trap 'kill "$ccs_smtp_test_pid" 2>/dev/null || true' EXIT
          php -d disable_functions=mail tests/mail.php
      - name: Gerar pacote
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-instalavel
          path: dist/ccshalom-escalas.zip
  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar pacote e identificar versão
        id: package
        run: echo "version=$(python3 scripts/package.py)" >> "$GITHUB_OUTPUT"
      - name: Publicar nova versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "Há um commit mais recente; a publicação será feita por sua validação."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "A versão v$VERSION já foi publicada; não será sobrescrita."
          else
            gh release create "v$VERSION" dist/ccshalom-escalas.zip --target "$GITHUB_SHA" --title "CCShalom Escalas $VERSION" --notes-file docs/RELEASE.md --latest
          fi

